<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">iOS 键盘变形 iOS Keyboard Morph — 软键盘自适应收缩与打字演示</title>
  <desc id="desc">浅蓝灰底标题：iOS 键盘变形，副标题输入一句英文，看键盘自己变形；右侧是键盘变形示意：完整 QWERTY 键盘经过箭头收缩成只剩 9 个字母键的方形，H 键上方弹出 iOS 风格的气泡预览。</desc>

  <rect width="1200" height="360" rx="26" fill="#e8eef5"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#4b5563">软键盘自适应收缩与打字演示 · KEYBOARD MORPH</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#111827">iOS 键盘变形</text>
    <text x="56" y="168" font-size="23" fill="#1f2937">iOS KEYBOARD MORPH — 输入一句英文，看键盘自己变形</text>
    <text x="56" y="204" font-size="19" fill="#4b5563">过滤未用字母、收缩重排、模拟打字，全程平滑动画。</text>
    <g id="chips" font-size="18" fill="#111827" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="119" y="262">3 种收缩模式</text></g>
      <g><rect x="194" y="238" width="162" height="36" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="275" y="262">View Transitions</text></g>
      <g><rect x="368" y="238" width="170" height="36" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="453" y="262">Web Audio 按键音</text></g>
      <g><rect x="550" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="625" y="262">导出 MP4/WebM</text></g>
    </g>
  </g>

  <g id="morph-demo" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="panel-full">
      <rect x="752" y="56" width="208" height="150" rx="12" fill="#d7dce3" stroke="#b6bec9" stroke-width="1.5"/>
      <g font-size="16" fill="#111827" text-anchor="middle">
        <g><rect x="764" y="72" width="28" height="30" rx="6" fill="#ffffff"/><text x="778" y="93">q</text></g>
        <g><rect x="796" y="72" width="28" height="30" rx="6" fill="#ffffff"/><text x="810" y="93">w</text></g>
        <g><rect x="828" y="72" width="28" height="30" rx="6" fill="#ffffff"/><text x="842" y="93">e</text></g>
        <g><rect x="860" y="72" width="28" height="30" rx="6" fill="#ffffff"/><text x="874" y="93">r</text></g>
        <g><rect x="892" y="72" width="28" height="30" rx="6" fill="#ffffff"/><text x="906" y="93">t</text></g>
        <g><rect x="924" y="72" width="28" height="30" rx="6" fill="#ffffff"/><text x="938" y="93">y</text></g>
        <g><rect x="780" y="108" width="28" height="30" rx="6" fill="#ffffff"/><text x="794" y="129">a</text></g>
        <g><rect x="812" y="108" width="28" height="30" rx="6" fill="#ffffff"/><text x="826" y="129">s</text></g>
        <g><rect x="844" y="108" width="28" height="30" rx="6" fill="#ffffff"/><text x="858" y="129">d</text></g>
        <g><rect x="876" y="108" width="28" height="30" rx="6" fill="#ffffff"/><text x="890" y="129">f</text></g>
        <g><rect x="908" y="108" width="28" height="30" rx="6" fill="#ffffff"/><text x="922" y="129">g</text></g>
        <g><rect x="796" y="144" width="28" height="30" rx="6" fill="#ffffff"/><text x="810" y="165">z</text></g>
        <g><rect x="828" y="144" width="28" height="30" rx="6" fill="#ffffff"/><text x="842" y="165">x</text></g>
        <g><rect x="860" y="144" width="28" height="30" rx="6" fill="#ffffff"/><text x="874" y="165">c</text></g>
        <g><rect x="892" y="144" width="28" height="30" rx="6" fill="#ffffff"/><text x="906" y="165">v</text></g>
      </g>
    </g>
    <text x="976" y="140" font-size="28" fill="#9a3412" text-anchor="middle">→</text>
    <g id="panel-square">
      <rect x="992" y="56" width="152" height="150" rx="12" fill="#d7dce3" stroke="#b6bec9" stroke-width="1.5"/>
      <g font-size="16" fill="#111827" text-anchor="middle">
        <g><rect x="1004" y="72" width="36" height="32" rx="6" fill="#ffffff"/><text x="1022" y="94">h</text></g>
        <g><rect x="1048" y="72" width="36" height="32" rx="6" fill="#ffffff"/><text x="1066" y="94">a</text></g>
        <g><rect x="1092" y="72" width="36" height="32" rx="6" fill="#ffffff"/><text x="1110" y="94">p</text></g>
        <g><rect x="1004" y="112" width="36" height="32" rx="6" fill="#ffffff"/><text x="1022" y="134">y</text></g>
        <g><rect x="1048" y="112" width="36" height="32" rx="6" fill="#ffffff"/><text x="1066" y="134">b</text></g>
        <g><rect x="1092" y="112" width="36" height="32" rx="6" fill="#ffffff"/><text x="1110" y="134">i</text></g>
        <g><rect x="1004" y="152" width="36" height="32" rx="6" fill="#ffffff"/><text x="1022" y="174">r</text></g>
        <g><rect x="1048" y="152" width="36" height="32" rx="6" fill="#ffffff"/><text x="1066" y="174">t</text></g>
        <g><rect x="1092" y="152" width="36" height="32" rx="6" fill="#ffffff"/><text x="1110" y="174">d</text></g>
      </g>
    </g>
    <g id="key-popup">
      <rect x="1002" y="16" width="40" height="38" rx="8" fill="#ffffff" stroke="#b6bec9" stroke-width="1.5"/>
      <path d="M1014 54 L1014 72 L1030 72 L1030 54 Z" fill="#ffffff"/>
      <text x="1022" y="44" font-size="20" fill="#111827" text-anchor="middle">h</text>
    </g>
    <g id="panel-labels" font-size="18" fill="#4b5563" text-anchor="middle">
      <text x="856" y="232">完整 QWERTY</text>
      <text x="1068" y="232">收缩为方形</text>
    </g>
    <text x="948" y="292" font-size="18" fill="#4b5563" text-anchor="middle">输入 Happy birthday → 只留 9 个字母键</text>
    <text x="948" y="324" font-size="18" fill="#4b5563" text-anchor="middle">气泡预览与按键音已完美适配</text>
  </g>
</svg>
